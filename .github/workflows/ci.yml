name: CI tests

on: [push, pull_request]

jobs:
  linux:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versions:
          - ghc: '9.6'
            cabal: 'latest'
            cabalopts: '--ghc-option=-Werror'
          - ghc: '9.8'
            cabal: 'latest'
            cabalopts: '--ghc-option=-Werror'
          - ghc: '9.10'
            cabal: 'latest'
            cabalopts: '--ghc-option=-Werror'
          - ghc: '9.12'
            cabal: 'latest'
            cabalopts: ''
    steps:
    - uses: actions/checkout@v7
    - name: Install cabal/ghc
      run: |
        ghcup install ghc --set ${{ matrix.versions.ghc }}
        ghcup install cabal --set ${{ matrix.versions.cabal }}

    - name: Cache cabal global package db
      id:   cabal-global
      uses: actions/cache@v6
      with:
        path: |
          ~/.cabal
        key: ${{ runner.os }}-${{ matrix.versions.ghc }}-${{ matrix.versions.cabal }}-cabal-global-${{ secrets.CACHE_VERSION }}

    - name: Install dependencies
      run: |
          cabal update && cabal build --dependencies-only --enable-tests --enable-benchmarks
    - name: Build
      run: |
          cabal build ${{ matrix.versions.cabalopts }} --enable-tests --enable-benchmarks
    - name: Test
      run: |
          cabal test

  windows:

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v7

    - name: Install ghc
      run: |
        ghcup install ghc --set 9.4.4

    - name: Cache cabal global package db
      id:   cabal-global
      uses: actions/cache@v6
      with:
        path: |
          C:\cabal\store
        key: ${{ runner.os }}-appdata-cabal-${{ hashFiles('cabal.project') }}-${{ secrets.CACHE_VERSION }}

    - name: Install dependencies
      run: |
          cabal update && cabal build --dependencies-only --enable-tests --enable-benchmarks
    - name: Build
      run: |
          cabal build --enable-tests --enable-benchmarks --ghc-options=-Werror
    - name: Test
      run: |
          cabal test
